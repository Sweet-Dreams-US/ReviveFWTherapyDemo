# Scheduled blog release — runs Mon/Wed/Fri, regenerates the blog for "today"
# (America/New_York) and pushes any newly-due posts. Vercel's Git integration
# then auto-deploys the commit. The generator is date-gated and idempotent, so a
# missed run self-heals on the next one (it always publishes everything due).
#
# Requirements (one-time, in the GitHub repo):
#   - Actions enabled (Settings → Actions → Allow all actions).
#   - Workflow write permission (Settings → Actions → Workflow permissions →
#     "Read and write permissions"). The `permissions:` block below also grants it.
#   - Vercel connected to this repo for production deploys on push to main
#     (already the case). If it is not, add a Vercel Deploy Hook as a secret and
#     uncomment the final step.
name: Publish scheduled blog posts

on:
  schedule:
    - cron: '0 13 * * 1,3,5'   # 13:00 UTC Mon/Wed/Fri (~9am US Eastern)
  workflow_dispatch: {}         # allow manual "publish now" from the Actions tab

permissions:
  contents: write

concurrency:
  group: publish-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate blog for today (Eastern)
        run: node scripts/build-blog.js

      - name: Commit and push any newly published posts
        run: |
          git config user.name "revive-blog-bot"
          git config user.email "info@revivefw.com"
          git add blog blog.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No posts due today — nothing to publish."
          else
            git commit -m "Blog: publish scheduled posts for $(TZ=America/New_York date +%Y-%m-%d)"
            git push
            echo "Published new post(s)."
          fi

      # If Vercel does NOT auto-deploy on push, create a Deploy Hook in the Vercel
      # project (Settings → Git → Deploy Hooks), store it as the repo secret
      # VERCEL_DEPLOY_HOOK, and uncomment:
      # - name: Trigger Vercel deploy
      #   if: ${{ secrets.VERCEL_DEPLOY_HOOK != '' }}
      #   run: curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"

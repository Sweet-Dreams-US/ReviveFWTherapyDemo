# Scheduled blog release — runs Mon/Wed/Fri, regenerates the blog for "today"
# (America/New_York) and deploys straight to Vercel production.
#
# This deploys with a Vercel token instead of pushing commits back to the repo,
# so it needs NEITHER "read and write" workflow permissions (often org-locked)
# NOR Vercel's git push-to-deploy. The generator is date-gated and idempotent, so
# a missed run self-heals on the next one (it always deploys everything due).
#
# ONE-TIME SETUP (repo → Settings → Secrets and variables → Actions):
#   - Add a secret named VERCEL_TOKEN.
#     Create the token at https://vercel.com/account/tokens (scope it to the
#     Sweet Dreams team). Nothing else is required — the org/project IDs below
#     are public identifiers, not secrets.
name: Publish scheduled blog posts

on:
  schedule:
    - cron: '0 13 * * 1,3,5'   # 13:00 UTC Mon/Wed/Fri (~9am US Eastern)
  workflow_dispatch: {}         # manual "publish now" from the Actions tab

# Non-secret Vercel identifiers (from .vercel/project.json) so the CLI links
# non-interactively in CI.
env:
  VERCEL_ORG_ID: team_4mlJIxMh7QofsXFfy1SA8fIG
  VERCEL_PROJECT_ID: prj_KzU7wTEpIXREQ3gy7SU3oWMq8qGm

concurrency:
  group: publish-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Regenerate blog for today (Eastern)
        run: node scripts/build-blog.js

      - name: Deploy to production
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
